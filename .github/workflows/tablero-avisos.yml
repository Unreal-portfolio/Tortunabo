# Avisos del tablero: a las 8:30, un correo al director con el resultado de la rutina y lo raro que haya entrado en dev.
#
# Ejecuta `tablero.py avisos --aplicar`:
# - abre una issue `sin-revision` (In review, P0, revisor cruzado) por cada push directo a `dev` con commits de código
#   que no son de ninguna PR fusionada, sea quien sea el autor, y cierra las que ya están revisadas y probadas;
# - apunta como incidencia cada PR fusionada en `dev` con una issue sin revisión aprobada (en un lote, también sin
#   probar) o sin issue y con código; lo que solo toca rutas de organización (equipo.json) va sin revisión a propósito;
# - comenta en la issue AVISOS_ISSUE el aviso de cada destinatario (equipo.json → avisos.destinatarios) con una
#   mención: incidencias, lo que espera por él y el parte del día de la rutina (PARTE_ISSUE).
#
# El comentario lo escribe github-actions con el GITHUB_TOKEN: GitHub no avisa a nadie de sus propias acciones, así que
# si lo escribiera el dueño de TABLERO_TOKEN no le llegaría el correo. Para leer el Project hace falta TABLERO_TOKEN,
# el mismo secreto del puente. Los comentarios del GITHUB_TOKEN no lanzan otros workflows. Si ese día ya se lanzó a
# mano, el cron no repite el correo.
#
# El código se toma de `dev`. Este fichero tiene que estar también en `main`: GitHub solo ejecuta los `schedule` de la
# rama por defecto.
name: Avisos del tablero

on:
  schedule:
    - cron: "30 6 * * *" # 8:30 en España en horario de verano: después del puente (7:15) y de la rutina (7:30)
  workflow_dispatch:
    inputs:
      publicar:
        description: "Comentar los avisos (y mandar los correos). Sin marcar, solo se ven en el resumen de la ejecución."
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: tablero-avisos
  cancel-in-progress: false

env:
  AVISOS_ISSUE: "196"
  PARTE_ISSUE: "127"

jobs:
  avisos:
    name: Avisar a cada persona
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.TABLERO_TOKEN }}
      AVISOS_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar dev (solo los scripts)
        uses: actions/checkout@v4
        with:
          ref: dev
          filter: blob:none
          sparse-checkout: |
            Scripts
          sparse-checkout-cone-mode: false

      - name: uv
        uses: astral-sh/setup-uv@v5

      - name: ¿Ya se publicaron hoy?
        id: hoy
        if: github.event_name == 'schedule'
        run: |
          desde="$(date -u +%F)T00:00:00Z"
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues/$AVISOS_ISSUE/comments?since=$desde&per_page=100" \n            --jq '[.[] | select(.user.login == "github-actions[bot]")] | length')
          echo "publicados=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" != "0" ]; then echo "Los avisos de hoy ya se publicaron ($n comentarios): no se repiten."; fi

      - name: Avisos
        if: steps.hoy.outputs.publicados == '' || steps.hoy.outputs.publicados == '0'
        env:
          PUBLICAR: ${{ github.event_name == 'schedule' || inputs.publicar }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secreto TABLERO_TOKEN (el mismo del puente)."
            exit 1
          fi
          destino=()
          if [ "$PUBLICAR" = "true" ]; then destino=(--publicar "$AVISOS_ISSUE"); fi
          uv run python Scripts/tablero/tablero.py avisos --aplicar --parte "$PARTE_ISSUE" "${destino[@]}" 2>&1 | tee avisos.txt
          exit "${PIPESTATUS[0]}"

      - name: Resumen de la ejecución
        if: always()
        run: |
          { echo "## Avisos del tablero"; echo '```'; cat avisos.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
