name: Fallo
description: Algo no funciona en el editor o en una build
labels: ["⚠️bug⚠️"]
body:
  - type: markdown
    attributes:
      value: |
        Título de 80 caracteres como mucho: el síntoma, sin el detalle. Si puedes, pídeselo a tu Claude («esto no funciona»): lo registra con `tablero.py`, en su objeto y con sus campos.
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Mapa, modo, número de jugadores (PIE 1P/4P, Standalone) y qué hiciste.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Casillas verificables en el editor. Como mínimo, que el fallo ya no ocurra.
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: rama
    attributes:
      label: Rama o commit
      placeholder: dev @ abc1234
