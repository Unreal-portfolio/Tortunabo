name: Fallo
description: Algo no funciona en el editor o en una build
labels: ["⚠️bug⚠️"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Mapa, modo, número de jugadores (PIE 1P/4P, Standalone) y qué hiciste.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: input
    id: rama
    attributes:
      label: Rama o commit
      placeholder: dev @ abc1234
