; Idiomas del juego (Docs/Localizacion.md). Anadir un idioma = una linea aqui + su cultura en CulturesToStage (arriba) + su traduccion.
; Culture: codigo de la localizacion. NativeName (opcional): el nombre escrito en su propio idioma; sin el, el del codigo
; (los trece de serie ya se conocen) o el que da el motor. FontRegular / FontBold / FontScript (opcionales): fuente de reserva, un
; archivo de Content/Slate/Fonts (se ignora si no existe); FontScript = CJK, Cyrillic o Latin (vacio = CJK).
