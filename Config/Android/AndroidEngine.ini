; Meta Quest sin PC (Docs/Modo_VR.md, «Build para las Quest»): lo que cambia respecto al PC.

[/Script/Engine.RendererSettings]
; Las dos vistas de las gafas en una sola pasada (sin HDR móvil, que no deja) y MSAA x4 en lugar del TAA.
vr.MobileMultiView=True
r.MobileHDR=False
r.Mobile.AntiAliasing=3
r.MSAACount=4

[OnlineSubsystem]
; Steam no existe en Android: partidas en red local (LAN) con el subsistema NULL.
DefaultPlatformService=Null

[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
