; Objetivo de localizacion 'Game' de Tortunavy (Docs/Localizacion.md). Creado a mano con la misma forma que los que
; genera el Localization Dashboard de UE 5.6; si se edita el objetivo en el Dashboard, este archivo se reescribe.
; Se ejecuta con Scripts/localization_gather_export.bat y Scripts/localization_import_compile.bat.
[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=es-ES
CulturesToGenerate=es-ES
CulturesToGenerate=en
CulturesToGenerate=fr
CulturesToGenerate=de
CulturesToGenerate=it
CulturesToGenerate=pt-BR
CulturesToGenerate=ru
CulturesToGenerate=pl
CulturesToGenerate=tr
CulturesToGenerate=ja
CulturesToGenerate=ko
CulturesToGenerate=zh-Hans
CulturesToGenerate=zh-Hant

; Textos del codigo: NSLOCTEXT y LOCTEXT de Source/Tortunabo (sin las pruebas automaticas).
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/Tortunabo
ExcludePathFilters=Config/Localization/*
ExcludePathFilters=Source/Tortunabo/Private/Tests/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

; Textos de los assets: propiedades FText de los blueprints, widgets, tablas de datos y mapas de Content.
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/L10N/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Game.csv
bConflictReport=true
ConflictReportName=Game_Conflicts.txt
